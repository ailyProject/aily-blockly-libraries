name: Legacy library object regression
on:
  pull_request:
    paths: ['otto/**', 'jq6500/**', '.scripts/legacy-object-names.test.cjs', '.github/workflows/legacy-object-regressions.yml']
  push:
    branches: [main]
    paths: ['otto/**', 'jq6500/**', '.scripts/legacy-object-names.test.cjs', '.github/workflows/legacy-object-regressions.yml']
permissions:
  contents: read
jobs:
  object-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .scripts/legacy-object-names.test.cjs
